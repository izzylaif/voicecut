name: Release

# Builds the installers for every system and attaches them to a DRAFT GitHub
# Release named after the app's version (desktop/src-tauri/tauri.conf.json).
# Nothing is published: review the draft on GitHub and publish it by hand.
# Runs by hand, or when a tag like v0.2.0 is pushed.
#
# With the TAURI_SIGNING_PRIVATE_KEY secret the draft also gets latest.json,
# which the installed apps read from the latest published release
# (releases/latest/download/latest.json) to update themselves, and the macOS
# archive it points to; the signatures go into latest.json.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  installers:
    uses: ./.github/workflows/desktop.yml
    secrets: inherit

  draft:
    name: Draft release
    needs: installers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')"
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error title=Version::tag ${GITHUB_REF_NAME} does not match the app's version ${version}"
            exit 1
          fi
          ls -l installers
          python3 desktop/scripts/updater_manifest.py installers --version "${version}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}" \
            --notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
          if [[ ! -f installers/latest.json ]]; then
            echo "::warning title=Updates::no TAURI_SIGNING_PRIVATE_KEY secret, so no latest.json: installed apps will not update to ${tag}"
          fi
          # The signatures are inside latest.json.
          assets=()
          for file in installers/*; do
            if [[ "${file}" != *.sig ]]; then
              assets+=("${file}")
            fi
          done
          if gh release view "${tag}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${tag}" --json isDraft --jq .isDraft)" != true ]]; then
              echo "::error title=Release::${tag} is already published; raise the version first"
              exit 1
            fi
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" --draft \
              --target "${GITHUB_SHA}" \
              --title "VoiceCut ${version}" \
              --notes-file desktop/RELEASE_NOTES.md
          fi
          echo "::notice title=Draft release::${tag} has ${#assets[@]} files; publish it on GitHub when ready"
