<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- VoiceCut app icon, drawn by hand on Apple's 1024 px macOS icon grid:
       a dark tile (the editor's background) with a waveform, and a "V" in
       the editor's green, split once across its right stroke like a clip on
       the timeline. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#262a31"/>
      <stop offset="1" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="600" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34c7a0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#34c7a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="280" x2="0" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7beccb"/>
      <stop offset="0.55" stop-color="#34c7a0"/>
      <stop offset="1" stop-color="#1b9a77"/>
    </linearGradient>
    <linearGradient id="wave" x1="196" y1="0" x2="828" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aa1ad" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#9aa1ad" stop-opacity="0.34"/>
      <stop offset="0.8" stop-color="#9aa1ad" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#9aa1ad" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="lift" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <!-- The split: a narrow gap across the V's right stroke. -->
    <mask id="split" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#ffffff"/>
      <line x1="534" y1="433" x2="726" y2="519" stroke="#000000" stroke-width="18"/>
    </mask>
    <clipPath id="tile-shape">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#tile-shape)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- A line of speech behind the V. -->
    <g fill="url(#wave)">
      <rect x="196" y="500" width="14" height="40" rx="7"/>
      <rect x="228" y="478" width="14" height="84" rx="7"/>
      <rect x="260" y="454" width="14" height="132" rx="7"/>
      <rect x="292" y="486" width="14" height="68" rx="7"/>
      <rect x="324" y="430" width="14" height="180" rx="7"/>
      <rect x="356" y="400" width="14" height="240" rx="7"/>
      <rect x="388" y="446" width="14" height="148" rx="7"/>
      <rect x="420" y="476" width="14" height="88" rx="7"/>
      <rect x="452" y="420" width="14" height="200" rx="7"/>
      <rect x="484" y="384" width="14" height="272" rx="7"/>
      <rect x="516" y="440" width="14" height="160" rx="7"/>
      <rect x="548" y="494" width="14" height="52" rx="7"/>
      <rect x="580" y="462" width="14" height="116" rx="7"/>
      <rect x="612" y="410" width="14" height="220" rx="7"/>
      <rect x="644" y="436" width="14" height="168" rx="7"/>
      <rect x="676" y="470" width="14" height="100" rx="7"/>
      <rect x="708" y="444" width="14" height="152" rx="7"/>
      <rect x="740" y="482" width="14" height="76" rx="7"/>
      <rect x="772" y="468" width="14" height="104" rx="7"/>
      <rect x="804" y="498" width="14" height="44" rx="7"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <g filter="url(#lift)">
    <polyline points="316,300 512,740 708,300" fill="none" stroke="url(#green)" stroke-width="122"
              stroke-linecap="round" stroke-linejoin="round" mask="url(#split)"/>
  </g>
</svg>
