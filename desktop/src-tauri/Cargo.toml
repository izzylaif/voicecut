[package]
name = "voicecut-desktop"
version = "0.4.2"
description = "VoiceCut for macOS, Linux and Windows: the VoiceCut editor as a desktop app"
authors = ["VoiceCut contributors"]
license = "MIT"
repository = "https://github.com/vectozavr/voicecut"
edition = "2021"
rust-version = "1.80"

[lib]
name = "voicecut_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
libc = "0.2"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# Ollama's Linux release is a .tar.zst.
[target.'cfg(target_os = "linux")'.dependencies]
zstd = "0.13"

[features]
# A loopback control port for end-to-end tests (see src/automation.rs);
# never part of a release build.
automation = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
